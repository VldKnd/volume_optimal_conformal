name: seed_01
seed: 1
save_directory: benchmark/results/synthetic/banana/transport_neural_ot_rearranged_l2

dataset_config:
  type: banana
  n_train: 20000
  n_calibration: 1000
  n_test: 1000
  x_dim: 1
  y_dim: 2
  seed: 1
  device: cuda
  dtype: float32

predictor_config:
  type: neural_optimal_transport
  x_dim: 1
  y_dim: 2
  hidden_dim: 16
  num_hidden_layers: 8
  c_transform_lr: 1.0
  c_transform_max_iter: 1000
  seed: 1
  device: cuda
  dtype: float32
predictor_checkpoint: benchmark/results/synthetic/banana/transport_neural_ot_l2/seed_01/base/predictor.pt

trainer_config:
  epochs: 500
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_iterations: 10
  grad_clip_norm: 1.0
  use_cosine_scheduler: true
  verbose: true

rearrangement_config:
  type: amortized_rearranged_transport
  x_dim: 1
  y_dim: 2
  hidden_dimension: 32
  number_of_hidden_layers: 9
  use_adjoint: false
  method: dopri5
  rtol: 0.0001
  atol: 0.00001
  vector_field_implementation: sparse
  activation: silu
  seed: 1
  device: cuda
  dtype: float32

rearrangement_trainer_config:
  epochs: 100
  train_transport_map: false
  learning_rate: 0.001
  weight_decay: 0.0001
  mc_samples_per_x: 16
  grad_clip_norm: 1.0
  use_cosine_scheduler: true
  verbose: true

supervised_rearrangement: false

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: norm
    p: 2.0
  volume_mc_samples: 1000
  volume_batch_size: 1024
  volume_seed: 1

train_batch_size: 1024
rearrangement_train_batch_size: 1024
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true

wandb:
  mode: online
  project: minimal-volume-conformal-prediction
  group: synthetic/banana/transport_neural_ot_rearranged_l2
  name: transport_neural_ot_rearranged_l2_seed_01
  tags:
    - synthetic
    - neural-ot
    - transport
    - l2
    - rearranged
    - amortized
    - sparse
    - dopri5
    - banana
  job_type: transport_neural_ot_rearranged_l2
  log_every_n_steps: 20
  log_solver_diagnostics: true
