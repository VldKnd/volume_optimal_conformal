name: seed_04
seed: 4
save_directory: benchmark/results/synthetic/sinusoidal_transport/transport_neural_ot_rearranged_l2

dataset_config:
  type: sinusoidal_transport
  n_train: 100000
  n_calibration: 1000
  n_test: 1000
  x_dim: 1
  y_dim: 2
  seed: 4
  device: cuda
  dtype: float32

predictor_config:
  type: neural_optimal_transport
  x_dim: 1
  y_dim: 2
  hidden_dim: 64
  num_hidden_layers: 8
  potential_type: u
  c_transform_lr: 1.0
  c_transform_max_iter: 1000
  seed: 4
  device: cuda
  dtype: float32
predictor_checkpoint: benchmark/results/synthetic/sinusoidal_transport/transport_neural_ot_l2/seed_04/base/predictor.pt

trainer_config:
  epochs: 250
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_iterations: 10
  grad_clip_norm: 10.0
  use_cosine_scheduler: true
  verbose: true

rearrangement_config:
  type: amortized_rearranged_transport
  x_dim: 1
  y_dim: 2
  hidden_dimension: 64
  number_of_hidden_layers: 8
  time_dependent: true
  vector_field_implementation: sparse
  activation: silu
  use_adjoint: false
  method: dopri5
  rtol: 0.0001
  atol: 1.0e-05
  number_of_steps: null
  seed: 4
  device: cuda
  dtype: float32

rearrangement_trainer_config:
  epochs: 100
  train_transport_map: false
  learning_rate: 0.0005
  weight_decay: 0.0001
  mc_samples_per_x: 16
  grad_clip_norm: 2.0
  use_cosine_scheduler: true
  verbose: true

supervised_rearrangement: false

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: norm
    p: 2.0
  volume_mc_samples: 1000
  volume_batch_size: 1024
  volume_seed: 4

train_batch_size: 1024
rearrangement_train_batch_size: 1024
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true

wandb:
  mode: online
  project: minimal-volume-conformal-prediction
  group: synthetic/sinusoidal_transport/transport_neural_ot_rearranged_l2
  name: transport_neural_ot_rearranged_l2_seed_04
  tags:
    - synthetic
    - neural-ot
    - big
    - transport
    - l2
    - rearranged
    - amortized
    - sparse
    - dopri5
    - sinusoidal_transport
  job_type: transport_neural_ot_rearranged_l2
  log_every_n_steps: 20
  log_solver_diagnostics: true
