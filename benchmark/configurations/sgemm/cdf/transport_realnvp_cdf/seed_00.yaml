name: seed_00
seed: 0
save_directory: benchmark/results/sgemm/cdf/transport_realnvp_cdf

dataset_config:
  type: sgemm
  file_path: data/sgemm/sgemm_product.csv
  x_dim: 14
  y_dim: 4
  train_fraction: 0.6
  calibration_fraction: 0.2
  test_fraction: 0.2
  seed: 0
  device: cuda
  dtype: float32

predictor_config:
  type: normalizing_flow
  x_dim: 14
  y_dim: 4
  hidden_dim: 32
  num_hidden_layers: 6
  num_flow_layers: 4
  log_scale_bound: 3.0
  seed: 0
  device: cuda
  dtype: float32
predictor_checkpoint: benchmark/downloads/results/sgemm/base_run/transport_realnvp_l2/seed_00/base/predictor.pt

trainer_config:
  epochs: 250
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  use_cosine_scheduler: true
  verbose: true

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: cdf_calibrator
    n_cdf_samples: 32
    cdf_batch_size: 65536
  volume_mc_samples: 1000
  volume_batch_size: 1024
  volume_n_neighbors: 100
  volume_seed: 0

train_batch_size: 4096
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true
