name: seed_03
seed: 3
save_directory: benchmark/results/synthetic_dimension_scaling/banana/dim_002/neural_ot_l2

dataset_config:
  type: banana
  n_train: 100000
  n_calibration: 1000
  n_test: 1000
  x_dim: 1
  y_dim: 2
  seed: 3
  device: cuda
  dtype: float32

predictor_config:
  type: neural_optimal_transport
  x_dim: 1
  y_dim: 2
  hidden_dim: 64
  num_hidden_layers: 8
  potential_type: u
  c_transform_lr: 1.0
  c_transform_max_iter: 1000
  seed: 3
  device: cuda
  dtype: float32

trainer_config:
  epochs: 250
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_iterations: 50
  grad_clip_norm: 10.0
  use_cosine_scheduler: true
  verbose: true

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: norm
    p: 2.0
  volume_mc_samples: 1000
  volume_batch_size: 1024
  volume_seed: 3

train_batch_size: 1024
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true

wandb:
  mode: online
  project: minimal-volume-conformal-prediction
  entity: null
  group: synthetic_dimension_scaling/banana/dim_002/neural_ot_l2
  name: neural_ot_l2_dim_002_seed_03
  tags:
    - synthetic
    - synthetic_dimension_scaling
    - banana
    - dimension-2
    - transport
    - neural-ot
    - l2
  job_type: neural_ot_l2
  log_every_n_steps: 20
  log_solver_diagnostics: false
