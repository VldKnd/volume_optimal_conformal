name: seed_01
seed: 1
save_directory: benchmark/results/synthetic_dimension_scaling/sinusoidal_transport/dim_004/neural_ot_rearranged_l2

dataset_config:
  type: sinusoidal_transport
  n_train: 100000
  n_calibration: 1000
  n_test: 1000
  x_dim: 1
  y_dim: 4
  seed: 1
  device: cuda
  dtype: float32
  x_low: 0.0
  x_high: 0.0
  amplitude: 1.0
  amplitude_x_scale: 0.0
  frequency: 2.0
  phase: 0.0
  vertical_scale: 1.0
  vertical_scale_x_scale: 0.0

predictor_config:
  type: neural_optimal_transport
  x_dim: 1
  y_dim: 4
  hidden_dim: 64
  num_hidden_layers: 8
  potential_type: u
  c_transform_lr: 1.0
  c_transform_max_iter: 1000
  seed: 1
  device: cuda
  dtype: float32
predictor_checkpoint: benchmark/results/synthetic_dimension_scaling/sinusoidal_transport/dim_004/neural_ot_l2/seed_01/base/predictor.pt

trainer_config:
  epochs: 250
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_iterations: 50
  grad_clip_norm: 10.0
  use_cosine_scheduler: true
  verbose: true

rearrangement_config:
  type: rearranged_transport
  x_dim: 1
  y_dim: 4
  hidden_dimension: 256
  number_of_hidden_layers: 1
  time_dependent: true
  vector_field_implementation: sparse
  activation: silu
  use_adjoint: false
  method: dopri5
  rtol: 1.0e-05
  atol: 1.0e-06
  number_of_steps: null
  seed: 1
  device: cuda
  dtype: float32

rearrangement_trainer_config:
  epochs: 100
  mc_samples_per_x: 32
  train_transport_map: false
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  use_cosine_scheduler: true
  verbose: true

supervised_rearrangement: false

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: norm
    p: 2.0
  volume_mc_samples: 1000
  volume_batch_size: 1024
  volume_seed: 1

train_batch_size: 1024
rearrangement_train_batch_size: 1024
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true

wandb:
  mode: online
  project: minimal-volume-conformal-prediction
  entity: null
  group: synthetic_dimension_scaling/sinusoidal_transport/dim_004/neural_ot_rearranged_l2
  name: neural_ot_rearranged_l2_dim_004_seed_01
  tags:
    - synthetic
    - synthetic_dimension_scaling
    - sinusoidal_transport
    - dimension-4
    - transport
    - neural-ot
    - l2
    - rearranged
    - non-amortized
    - sparse
    - dopri5
  job_type: neural_ot_rearranged_l2
  log_every_n_steps: 20
  log_solver_diagnostics: true
