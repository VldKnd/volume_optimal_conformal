name: seed_03
seed: 3
save_directory: benchmark/results/10_seeds/onp/realnvp_l2

dataset_config:
  type: onp
  file_path: data/onp/OnlineNewsPopularity.csv
  x_dim: 29
  y_dim: 8
  train_fraction: 0.6
  calibration_fraction: 0.2
  test_fraction: 0.2
  seed: 3
  device: cuda
  dtype: float32

predictor_config:
  type: normalizing_flow
  x_dim: 29
  y_dim: 8
  hidden_dim: 64
  num_hidden_layers: 4
  num_flow_layers: 4
  log_scale_bound: 3.0
  seed: 3
  device: cuda
  dtype: float32

trainer_config:
  epochs: 250
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  use_cosine_scheduler: true
  verbose: true

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: norm
    p: 2.0
  volume_mc_samples: 1000
  volume_batch_size: 1024
  volume_n_neighbors: 100
  volume_seed: 3

train_batch_size: 4096
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true

wandb:
  mode: online
  project: minimal-volume-conformal-prediction
  entity: null
  group: 10_seeds/onp/realnvp_l2
  name: realnvp_l2_seed_03
  tags:
    - onp
    - 10_seeds
    - final-benchmark
    - transport
    - normalizing-flow
    - realnvp
    - l2
  job_type: realnvp_l2
  log_every_n_steps: 20
  log_solver_diagnostics: false
