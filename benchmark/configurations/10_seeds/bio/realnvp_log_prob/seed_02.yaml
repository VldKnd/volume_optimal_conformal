name: seed_02
seed: 2
save_directory: benchmark/results/10_seeds/bio/realnvp_log_prob

dataset_config:
  type: bio
  file_path: data/bio/CASP.csv
  x_dim: 8
  y_dim: 2
  train_fraction: 0.6
  calibration_fraction: 0.2
  test_fraction: 0.2
  seed: 2
  device: cuda
  dtype: float32

predictor_config:
  type: normalizing_flow
  x_dim: 8
  y_dim: 2
  hidden_dim: 64
  num_hidden_layers: 4
  num_flow_layers: 4
  log_scale_bound: 3.0
  seed: 2
  device: cuda
  dtype: float32
predictor_checkpoint: benchmark/results/10_seeds/bio/realnvp_l2/seed_02/base/predictor.pt

trainer_config:
  epochs: 250
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  use_cosine_scheduler: true
  verbose: true

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: log_probability
  volume_mc_samples: 1000
  volume_batch_size: 1024
  volume_n_neighbors: 100
  volume_seed: 2

train_batch_size: 4096
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true

wandb:
  mode: online
  project: minimal-volume-conformal-prediction
  entity: null
  group: 10_seeds/bio/realnvp_log_prob
  name: realnvp_log_prob_seed_02
  tags:
    - bio
    - 10_seeds
    - final-benchmark
    - transport
    - normalizing-flow
    - realnvp
    - log-probability
  job_type: realnvp_log_prob
  log_every_n_steps: 20
  log_solver_diagnostics: false
