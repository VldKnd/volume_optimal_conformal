name: seed_07
seed: 7
save_directory: benchmark/results/scm20d/transport_cpflow_l2

dataset_config:
  type: scm20d
  file_path: data/scm20d/file1730492b4408.arff
  x_dim: 61
  y_dim: 16
  train_fraction: 0.6
  calibration_fraction: 0.2
  test_fraction: 0.2
  seed: 7
  device: cuda
  dtype: float32

predictor_config:
  type: convex_potential_flow
  x_dim: 61
  y_dim: 16
