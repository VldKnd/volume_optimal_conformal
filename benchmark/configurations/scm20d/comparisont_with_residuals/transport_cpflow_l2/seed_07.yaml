  num_hidden_layers: 2
  num_blocks: 4
  inverse_max_iter: 1000
  inverse_lr: 1.0
  inverse_tolerance: 0.00000001
  seed: 7
  device: cuda
  dtype: float32

trainer_config:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  use_cosine_scheduler: true
  verbose: true

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: norm
    p: 2.0
  volume_mc_samples: 1000
  volume_batch_size: 1024
  volume_seed: 7

train_batch_size: 256
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true
