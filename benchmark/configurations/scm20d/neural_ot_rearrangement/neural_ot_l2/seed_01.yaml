name: seed_01
seed: 1
save_directory: benchmark/results/scm20d/neural_ot_rearrangement/transport_neural_ot_l2

dataset_config:
  type: scm20d
  file_path: data/scm20d/file1730492b4408.arff
  x_dim: 61
  y_dim: 16
  train_fraction: 0.6
  calibration_fraction: 0.2
  test_fraction: 0.2
  seed: 1
  device: cuda
  dtype: float32

predictor_config:
  type: neural_optimal_transport
  x_dim: 61
  y_dim: 16
  hidden_dim: 5
  num_hidden_layers: 3
  potential_type: u
  c_transform_lr: 1.0
  c_transform_max_iter: 1000
  seed: 1
  device: cuda
  dtype: float32

trainer_config:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_iterations: 1
  grad_clip_norm: 10.0
  use_cosine_scheduler: true
  verbose: true

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: norm
    p: 2.0
  volume_mc_samples: 1000
  volume_batch_size: 1024
  volume_seed: 1

train_batch_size: 256
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true

wandb:
  mode: online
  project: minimal-volume-conformal-prediction
  entity: null
  group: scm20d/neural_ot_rearrangement/transport_neural_ot_l2
  name: seed_01
  tags:
    - scm20d
    - neural-ot
  log_every_n_steps: 20
  log_solver_diagnostics: true

