name: seed_01
seed: 1
save_directory: benchmark/results/student_t/nu_3_k_2_y_dim_8/transport_neural_ot_l2

dataset_config:
  type: student_t_dataset
  n_train: 20000
  n_calibration: 1000
  n_test: 1000
  x_dim: 1
  y_dim: 8
  nu: 3.0
  k: 2.0
  seed: 1
  device: cuda
  dtype: float32

predictor_config:
  type: neural_optimal_transport
  x_dim: 1
  y_dim: 8
  hidden_dim: 16
  num_hidden_layers: 8
  c_transform_lr: 1.0
  c_transform_max_iter: 1000
  seed: 1
  device: cuda
  dtype: float32

trainer_config:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_iterations: 10
  grad_clip_norm: 1.0
  use_cosine_scheduler: true
  verbose: true

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: norm
    p: 2.0
  volume_mc_samples: 1000
  volume_batch_size: 1024
  volume_seed: 1

train_batch_size: 1024
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true

wandb:
  mode: online
  project: minimal-volume-conformal-prediction
  group: student_t/nu_3_k_2_y_dim_8/transport_neural_ot_l2
  name: nu_3_k_2_y_dim_8_transport_neural_ot_l2_seed_01
  tags:
    - student-t
    - synthetic
    - neural-ot
    - transport
    - l2
    - nu_3_k_2_y_dim_8
  job_type: transport_neural_ot_l2
  log_every_n_steps: 20
  log_solver_diagnostics: false
