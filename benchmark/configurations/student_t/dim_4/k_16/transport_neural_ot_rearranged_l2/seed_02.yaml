name: seed_02
seed: 2
save_directory: benchmark/results/student_t/dim_4/k_16/transport_neural_ot_rearranged_l2

dataset_config:
  type: student_t_dataset
  n_train: 100000
  n_calibration: 1000
  n_test: 1000
  x_dim: 1
  y_dim: 4
  nu: 3.0
  k: 16.0
  seed: 2
  device: cuda
  dtype: float32

predictor_config:
  type: neural_optimal_transport
  x_dim: 1
  y_dim: 4
  hidden_dim: 64
  num_hidden_layers: 8
  potential_type: u
  c_transform_lr: 1.0
  c_transform_max_iter: 1000
  seed: 2
  device: cuda
  dtype: float32
predictor_checkpoint: benchmark/results/student_t/dim_4/k_16/transport_neural_ot_l2/seed_02/base/predictor.pt

trainer_config:
  epochs: 250
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_iterations: 10
  grad_clip_norm: 1.0
  use_cosine_scheduler: true
  verbose: true

rearrangement_config:
  type: rearranged_transport
  x_dim: 1
  y_dim: 4
  hidden_dimension: 256
  number_of_hidden_layers: 1
  time_dependent: true
  vector_field_implementation: sparse
  activation: silu
  use_adjoint: true
  method: dopri5
  rtol: 1.0e-05
  atol: 1.0e-06
  number_of_steps: null
  seed: 2
  device: cuda
  dtype: float32

rearrangement_trainer_config:
  epochs: 100
  train_transport_map: false
  learning_rate: 0.001
  weight_decay: 0.0001
  mc_samples_per_x: 16
  grad_clip_norm: 1.0
  use_cosine_scheduler: true
  verbose: true

supervised_rearrangement: false

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: norm
    p: 2.0
  volume_mc_samples: 1000
  volume_batch_size: 1024
  volume_seed: 2

train_batch_size: 1024
rearrangement_train_batch_size: 1024
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true

wandb:
  mode: online
  project: minimal-volume-conformal-prediction
  group: student_t/dim_4/k_16/transport_neural_ot_rearranged_l2
  name: dim_4_k_16_transport_neural_ot_rearranged_l2_seed_02
  tags:
    - table_1
    - student-t
    - synthetic
    - neural-ot
    - transport
    - l2
    - dim_4/k_16
    - rearranged
    - sparse
    - adjoint
    - dopri5
  job_type: transport_neural_ot_rearranged_l2
  log_every_n_steps: 20
  log_solver_diagnostics: true
