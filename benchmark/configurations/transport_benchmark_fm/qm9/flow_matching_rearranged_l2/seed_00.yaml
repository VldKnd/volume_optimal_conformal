name: seed_00
seed: 0
save_directory: benchmark/results/transport_benchmark/qm9/flow_matching_rearranged_l2

dataset_config:
  type: qm9
  file_path: data/qm9/qm9_mbtr_100.npz
  raw_root: data/qm9/pyg
  x_dim: 100
  y_dim: 4
  train_fraction: 0.6
  calibration_fraction: 0.2
  test_fraction: 0.2
  seed: 0
  device: cuda
  dtype: float32

predictor_config:
  type: flow_matching
  x_dim: 100
  y_dim: 4
  hidden_dim: 128
  num_hidden_layers: 3
  ode_steps: 20
  use_hutchinson_trace_estimator: false
  seed: 0
  device: cuda
  dtype: float32
predictor_checkpoint: benchmark/results/transport_benchmark/qm9/flow_matching_l2/seed_00/base/predictor.pt

trainer_config:
  epochs: 250
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  covariate_noise_std: 0.0
  target_noise_std: 0.0
  use_cosine_scheduler: true
  verbose: true

rearrangement_config:
  type: rearranged_transport
  x_dim: 100
  y_dim: 4
  hidden_dimension: 8
  number_of_hidden_layers: 1
  time_dependent: true
  vector_field_implementation: sparse
  activation: silu
  use_adjoint: false
  method: dopri5
  rtol: 1.0e-05
  atol: 1.0e-06
  number_of_steps: null
  seed: 0
  device: cuda
  dtype: float32

rearrangement_trainer_config:
  epochs: 100
  mc_samples_per_x: 32
  train_transport_map: false
  coverage_mass_range:
    - 0.0
    - 1.0
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  use_cosine_scheduler: true
  verbose: true
  transport_log_det_options:
    ode_steps: 20
    use_hutchinson_trace_estimator: true

supervised_rearrangement: false

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: norm
    p: 2.0
  volume_mc_samples: 1000
  volume_batch_size: 4096
  volume_n_neighbors: 100
  volume_seed: 0

train_batch_size: 512
rearrangement_train_batch_size: 512
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true

wandb:
  mode: online
  project: minimal-volume-conformal-prediction
  entity: null
  group: transport_benchmark/qm9/flow_matching_rearranged_l2
  name: flow_matching_rearranged_l2_seed_00
  tags:
    - qm9
    - transport_benchmark
    - transport
    - flow-matching
    - l2
    - rearranged
    - non-amortized
    - sparse
    - dopri5
  job_type: flow_matching_rearranged_l2
  log_every_n_steps: 20
  log_solver_diagnostics: true
