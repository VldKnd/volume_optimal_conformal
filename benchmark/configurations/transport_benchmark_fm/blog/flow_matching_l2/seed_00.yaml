name: seed_00
seed: 0
save_directory: benchmark/results/transport_benchmark/blog/flow_matching_l2

dataset_config:
  type: blog
  file_path: data/blog/blogData_train.csv
  x_dim: 279
  y_dim: 2
  train_fraction: 0.6
  calibration_fraction: 0.2
  test_fraction: 0.2
  seed: 0
  device: cuda
  dtype: float32

predictor_config:
  type: flow_matching
  x_dim: 279
  y_dim: 2
  hidden_dim: 128
  num_hidden_layers: 3
  ode_steps: 100
  use_hutchinson_trace_estimator: false
  seed: 0
  device: cuda
  dtype: float32

trainer_config:
  epochs: 250
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  covariate_noise_std: 0.0
  target_noise_std: 0.0
  use_cosine_scheduler: true
  verbose: true

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: norm
    p: 2.0
  volume_mc_samples: 1000
  volume_batch_size: 1024
  volume_n_neighbors: 100
  volume_seed: 0

train_batch_size: 512
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true

wandb:
  mode: online
  project: minimal-volume-conformal-prediction
  entity: null
  group: transport_benchmark/blog/flow_matching_l2
  name: flow_matching_l2_seed_00
  tags:
    - blog
    - transport_benchmark
    - transport
    - flow-matching
    - l2
  job_type: flow_matching_l2
  log_every_n_steps: 20
  log_solver_diagnostics: false
