name: seed_04
seed: 4
save_directory: benchmark/results/bio/base_run/transport_realnvp_l2

dataset_config:
  type: bio
  file_path: data/bio/CASP.csv
  x_dim: 8
  y_dim: 2
  train_fraction: 0.6
  calibration_fraction: 0.2
  test_fraction: 0.2
  seed: 4
  device: cuda
  dtype: float32

predictor_config:
  type: normalizing_flow
  x_dim: 8
  y_dim: 2
  hidden_dim: 16
  num_hidden_layers: 4
  num_flow_layers: 4
  log_scale_bound: 3.0
  seed: 4
  device: cuda
  dtype: float32

trainer_config:
  epochs: 250
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  use_cosine_scheduler: true
  verbose: true

conformal_config:
  type: transport_based
  coverage_mass: 0.9
  calibrator:
    type: norm
    p: 2.0
  volume_mc_samples: 1000
  volume_batch_size: 1024
  volume_seed: 4

train_batch_size: 4096
calibration_batch_size: 512
test_batch_size: 512
compute_volume: true
metrics_verbose: true

wandb:
  mode: online
  project: minimal-volume-conformal-prediction
  entity: null
  group: bio/transport_realnvp_l2
  name: transport_realnvp_l2_seed_04
  tags:
    - bio
    - benchmark-comparison
    - normalizing-flow
    - realnvp
    - transport
    - l2
  job_type: transport_realnvp_l2
  log_every_n_steps: 20
  log_solver_diagnostics: false
